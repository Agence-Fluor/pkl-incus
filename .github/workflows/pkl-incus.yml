name: Incus Pkl package

on:
  push:
    branches: ["**"]
    tags: ["incus-pkl@*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/release-tag.sh "$TAG"
      - uses: actions/checkout@v7
        with:
          repository: Agence-Fluor/pkl-nix-tools
          ref: pkl-nix-tools@0.1.5
          path: .ci/pkl-nix-tools
      - run: echo "$GITHUB_WORKSPACE/.ci/pkl-nix-tools" >> "$GITHUB_PATH"
      - name: Check generated specifications and package import
        run: >-
          ./flake.pkl develop
          --command sh -c 'python3 scripts/gen-incus-pkl.py --check && sh scripts/test-package.sh'
      - name: Build the publishable Pkl package
        run: >-
          ./flake.pkl develop
          --command sh scripts/package-pkl.sh dist/package
      - uses: actions/upload-artifact@v7
        with:
          name: incus-pkl-package
          path: dist/package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/incus-pkl@')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - uses: actions/download-artifact@v8
        with:
          name: incus-pkl-package
          path: dist/package
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-tag.sh "$TAG"
      - name: Publish Pkl package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#incus-pkl@}
          gh release create "$TAG" \
            "dist/package/incus-pkl@$version" \
            "dist/package/incus-pkl@$version.sha256" \
            "dist/package/incus-pkl@$version.zip" \
            "dist/package/incus-pkl@$version.zip.sha256" \
            --verify-tag --generate-notes
